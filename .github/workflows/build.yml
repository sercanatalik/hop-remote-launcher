name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build universal app
        run: UNIVERSAL=1 ./build.sh

      - name: Check binary
        run: |
          lipo -info build/Hop.app/Contents/MacOS/Hop
          plutil -lint build/Hop.app/Contents/Info.plist

      - name: Zip
        run: ditto -c -k --keepParent build/Hop.app Hop.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Hop
          path: Hop.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Hop.zip --title "Hop $VERSION" --generate-notes
