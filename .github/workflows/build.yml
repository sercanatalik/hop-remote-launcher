name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          fi
          if [[ -n "${TAG:-}" ]]; then
            echo "TAG=$TAG" >> "$GITHUB_ENV"
            echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build universal app
        run: UNIVERSAL=1 ./build.sh

      - name: Check binary
        run: |
          lipo -info build/Hop.app/Contents/MacOS/Hop
          plutil -lint build/Hop.app/Contents/Info.plist

      - name: Zip
        run: ditto -c -k --keepParent build/Hop.app Hop.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Hop
          path: Hop.zip

      # A release published on GitHub (or a pushed v* tag) gets Hop.zip attached.
      - name: Attach to release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Hop.zip --clobber
          else
            gh release create "$TAG" Hop.zip --title "Hop $VERSION" --generate-notes
          fi
